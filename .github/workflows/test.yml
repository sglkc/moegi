# Offline CI only. Live Spotify e2e (pnpm test:e2e) is manual — needs login + CDP Chrome.
name: Test

on:
  push:
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - 'e2e/**'
      - 'LICENSE'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - 'e2e/**'
      - 'LICENSE'

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline:
    name: Offline (compile + test + build)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.11.0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript check
        run: pnpm run compile

      - name: Unit & feature tests (Vitest, no browser)
        run: pnpm run test

      - name: Production build
        run: pnpm run build
